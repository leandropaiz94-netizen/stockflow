<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Alta Producto — StockFlow</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css" />

  <style>
    .alta {
      max-width: 560px;
      margin: 0 auto;
      padding: 3rem 2rem 4rem;
    }

    .alta__title {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    .alta__sub {
      color: var(--c-text-muted);
      font-size: 0.9rem;
      margin-bottom: 2.5rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 1.25rem;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--c-text-muted);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--radius);
      color: var(--c-text);
      font-family: var(--font-body);
      font-size: 0.95rem;
      padding: 0.75rem 1rem;
      outline: none;
      width: 100%;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 90px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .btn-submit {
      width: 100%;
      padding: 0.9rem;
      background: var(--c-accent);
      border: none;
      border-radius: var(--radius);
      color: #000;
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <header class="navbar">
    <div class="navbar__brand">
      <span class="navbar__icon">⬡</span>
      <span class="navbar__name">StockFlow</span>
    </div>

    <nav class="navbar__links">
      <a href="../index.html">Catálogo</a>
      <a href="alta.html" class="active">Alta producto</a>
    </nav>
  </header>

  <section class="alta">

    <h1 class="alta__title">Alta de producto</h1>

    <p class="alta__sub">
      Completá el formulario para agregar un nuevo insumo al sistema.
    </p>

    <form id="altaForm">

      <div class="form-group">
        <label for="nombre">Nombre *</label>
        <input type="text" id="nombre" required />
      </div>

      <div class="form-row">

        <div class="form-group">
          <label for="codigo">Código *</label>
          <input type="text" id="codigo" required />
        </div>

        <div class="form-group">
          <label for="categoria">Categoría *</label>

          <select id="categoria" required>
            <option value="">Seleccioná...</option>
            <option value="descartable">Descartable</option>
            <option value="instrumental">Instrumental</option>
            <option value="medicamento">Medicamento</option>
            <option value="equipo">Equipo</option>
          </select>
        </div>

      </div>

      <div class="form-row">

        <div class="form-group">
          <label for="stock">Stock</label>
          <input type="number" id="stock" min="0" />
        </div>

        <div class="form-group">
          <label for="precio">Precio</label>
          <input type="number" id="precio" min="0" />
        </div>

      </div>

      <div class="form-group">
        <label for="descripcion">Descripción</label>

        <textarea id="descripcion"></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        Agregar producto
      </button>

    </form>

  </section>

  <script>

    const form = document.getElementById('altaForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {

      e.preventDefault();

      const producto = {
        nombre: document.getElementById('nombre').value.trim(),
        codigo: document.getElementById('codigo').value.trim(),
        categoria: document.getElementById('categoria').value,
        stock: Number(document.getElementById('stock').value) || 0,
        precio: Number(document.getElementById('precio').value) || 0,
        descripcion: document.getElementById('descripcion').value.trim()
      };

      submitBtn.disabled = true;
      submitBtn.textContent = 'Guardando...';

      try {

        const response = await fetch('/api/productos', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(producto)
        });

        const data = await response.json();

        if (!response.ok) {
          console.error(data);
          alert(data.error || 'Error al guardar producto');
          return;
        }

        console.log(data);

        alert('Producto agregado correctamente');

        form.reset();

      } catch (error) {

        console.error(error);

        alert('Error al conectar con el servidor');

      } finally {

        submitBtn.disabled = false;
        submitBtn.textContent = 'Agregar producto';
      }

    });

  </script>

</body>
</html>
